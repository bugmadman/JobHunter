security:
    password_hashers:
        App\Entity\User: 'auto'

    providers:
        app_user_provider:
            id: App\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: /logout
                enable_csrf: true

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/docs(\.[^/]+)?$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    services:
        test.login_throttling.storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

    security:
        firewalls:
            main:
                login_throttling:
                    storage_service: test.login_throttling.storage
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
