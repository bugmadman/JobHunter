security:
    password_hashers:
        App\Entity\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: /logout
                enable_csrf: true

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/docs(\.[^/]+)?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1(/(index(\.[^/]+)?)?)?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/(contexts|\.well-known|errors|validation_errors)/, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
            Symfony\Component\Security\Core\User\InMemoryUser: plaintext

        # Functional tests log in with loginUser(), and the entity provider would refresh that user from the DB.
        # The password must match the one passed to loginUser(): InMemoryUser::isEqualTo() compares them
        providers:
            test_users:
                memory:
                    users:
                        owner@example.com: { password: owner, roles: [ROLE_USER] }

        firewalls:
            main:
                provider: test_users
