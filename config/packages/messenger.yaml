framework:
    messenger:
        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'

        routing:
            App\Message\AnalyzeCv: async
            App\Message\GenerateCoverLetter: async
            App\Message\GeneratePrompt: async
            App\Message\ProcessJobPosting: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
