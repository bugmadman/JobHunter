; Loaded on top of PHP's built-in defaults: the base image ships no php.ini

; Don't reveal the PHP version in the X-Powered-By response header: the server is exposed to the internet
expose_php = Off

; CV upload (PDF only): a CV with embedded fonts or a photo can exceed the 2M default
upload_max_filesize = 10M
; Must exceed upload_max_filesize: the request body also carries the other form fields
post_max_size = 12M

; Sizing recommended by Symfony, the defaults are too small for a Symfony application:
; https://symfony.com/doc/7.4/performance.html#configure-opcache-for-maximum-performance
; Timestamp validation stays on (the default): edited files must be picked up in dev
opcache.memory_consumption = 256
opcache.max_accelerated_files = 32531
opcache.interned_strings_buffer = 32
