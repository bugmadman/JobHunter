# Dev only: docker compose merges this file automatically, prod lists its files explicitly and skips it
services:
  php:
    environment:
      FRANKENPHP_WORKER_CONFIG: watch

  postgres:
    # Bound to localhost: a DB client on the host can connect, the local network can't
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
